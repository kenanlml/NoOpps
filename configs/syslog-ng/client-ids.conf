# Client IDS : /etc/syslog-ng/conf.d/client-ids.conf
# Remplacer COLLECTOR_IP par l'IP Tailscale du collecteur (100.80.61.14).
# Décommenter le bloc Snort 3 ou le bloc Suricata selon l'IDS utilisé.

destination d_collector_ids {
    syslog("COLLECTOR_IP" transport("tcp") port(601)
        # Nom distinct de client-web.conf, les deux pouvant être chargés sur la même VM
        persist-name("collector-ids")
        # Garde les alertes si le collecteur est injoignable
        disk-buffer(reliable(no) capacity-bytes(268435456) dir("/var/lib/syslog-ng"))
    );
};

# Snort 3 : alert_json
# Dans snort.lua, les champs par défaut ne contiennent ni les adresses ni le message :
#   alert_json = {
#       file = true,
#       limit = 100,
#       fields = 'timestamp proto src_addr src_port dst_addr dst_port gid sid rev msg class priority action',
#   }
# Le fichier alert_json.txt est écrit dans le répertoire passé à snort -l.
#
#source s_snort {
#    file("/var/log/snort/alert_json.txt" program-override("snort") flags(no-parse));
#};
#
#log { source(s_snort); destination(d_collector_ids); };

# Suricata : eve.json
# Dans suricata.yaml, output eve-log activé (filename: eve.json). Seuls les
# événements de type alert sont envoyés, eve.json contenant aussi flow, dns, http...
#
#source s_suricata {
#    file("/var/log/suricata/eve.json" program-override("suricata") flags(no-parse));
#};
#
#filter f_suricata_alert {
#    message('"event_type":"alert"' type(string) flags(substring));
#};
#
#log { source(s_suricata); filter(f_suricata_alert); destination(d_collector_ids); };
