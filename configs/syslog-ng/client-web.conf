# Client serveur web : /etc/syslog-ng/conf.d/client-web.conf
# Remplacer COLLECTOR_IP par l'IP Tailscale du collecteur (100.80.61.14).

destination d_collector_web {
    syslog("COLLECTOR_IP" transport("tcp") port(601)
        persist-name("collector-web")
        disk-buffer(reliable(no) capacity-bytes(268435456) dir("/var/lib/syslog-ng"))
    );
};

# Les lignes Apache n'ont pas d'en-tête syslog : le programme est fixé ici,
# le collecteur s'en sert pour le routage vers l'index web.
source s_apache_access {
    file("/var/log/apache2/access.log" program-override("apache-access") flags(no-parse));
};

source s_apache_error {
    file("/var/log/apache2/error.log" program-override("apache-error") flags(no-parse));
};

source s_auth {
    file("/var/log/auth.log");
};

log {
    source(s_apache_access);
    source(s_apache_error);
    source(s_auth);
    destination(d_collector_web);
};
