# Collecteur central : /etc/syslog-ng/conf.d/collector.conf
# Inclus par /etc/syslog-ng/syslog-ng.conf (qui charge déjà scl.conf).

# Définit es_user et es_password, hors du dépôt (voir es-credentials.conf.example)
@include "/etc/syslog-ng/es-credentials.conf"

# Garde le hostname d'origine du client plutôt que son IP Tailscale
source s_tcp {
    syslog(ip(0.0.0.0) port(601) transport("tcp") max-connections(100) log-iw-size(10000)
           keep-hostname(yes) use-dns(no));
};

# Le format (RFC 3164 ou RFC 5424) est détecté dans le chemin de log
source s_udp {
    network(ip(0.0.0.0) port(514) transport("udp") flags(no-parse));
};

parser p_json {
    json-parser(prefix("json."));
};

parser p_apache_access {
    apache-accesslog-parser(prefix(".apache."));
};

# Snort 3 (alert_json) et Suricata (eve.json) nomment les champs différemment :
# un seul des deux est renseigné, la concaténation donne la bonne valeur.
rewrite r_ids {
    set("${json.src_ip}${json.src_addr}" value("src_ip"));
    set("${json.dest_ip}${json.dst_addr}" value("dest_ip"));
    set("${json.src_port}" value("src_port"));
    set("${json.dest_port}${json.dst_port}" value("dest_port"));
    set("${json.proto}" value("proto"));
    set("${json.alert.signature}${json.msg}" value("signature"));
    set("${json.alert.signature_id}${json.sid}" value("signature_id"));
    set("${json.alert.severity}${json.priority}" value("priority"));
    set("${json.alert.category}${json.class}" value("classification"));
    set("ids-alerts" value("es_index"));
};

rewrite r_web {
    set("${.apache.clientip}" value("src_ip"));
    set("${.apache.verb}" value("http_method"));
    set("${.apache.request}" value("url"));
    set("${.apache.response}" value("http_status"));
    set("${.apache.agent}" value("user_agent"));
    set("web" value("es_index"));
};

rewrite r_syslog {
    set("syslog" value("es_index"));
};

filter f_ids {
    program("^(snort|suricata)$")
    or "${json.alert.signature}" ne ""
    or "${json.msg}" ne "";
};

filter f_web {
    program("^apache");
};

destination d_elasticsearch {
    elasticsearch-http(
        url("http://127.0.0.1:9200/_bulk")
        # Obligatoire mais ignoré : l'index est défini dans body()
        index("")
        user("`es_user`")
        password("`es_password`")
        batch-lines(100)
        batch-timeout(2000)
        workers(2)
        # Remplace le body() du pilote : sous Ubuntu 4.8.1, format-json y produit un
        # champ "_type" invalide que Elasticsearch 8 rejette (erreur 400 sur _bulk).
        body("{\"index\":{\"_index\":\"${es_index}-${S_YEAR}.${S_MONTH}.${S_DAY}\"}}\n$(format-json --omit-empty-values
            @timestamp=${S_ISODATE}
            host=${HOST}
            program=${PROGRAM}
            facility=${FACILITY}
            severity=${LEVEL}
            message=${MESSAGE}
            src_ip=${src_ip}
            dest_ip=${dest_ip}
            src_port=${src_port}
            dest_port=${dest_port}
            proto=${proto}
            signature=${signature}
            signature_id=${signature_id}
            priority=${priority}
            classification=${classification}
            http_method=${http_method}
            url=${url}
            http_status=${http_status}
            user_agent=${user_agent}
            --key json.* --rekey json.* --replace-prefix json.=raw.)")
        # Garde les messages sur disque si Elasticsearch est indisponible
        disk-buffer(
            reliable(no)
            capacity-bytes(1073741824)
            dir("/var/lib/syslog-ng")
        )
    );
};

log {
    junction {
        channel { source(s_tcp); flags(final); };
        channel {
            source(s_udp);
            junction {
                channel { filter { message("^<[0-9]{1,3}>1 "); }; parser { syslog-parser(flags(syslog-protocol)); }; flags(final); };
                channel { parser { syslog-parser(); }; flags(final); };
            };
            flags(final);
        };
    };

    # Les messages non JSON passent par le second canal sans être modifiés
    junction {
        channel { filter { message("^\\{"); }; parser(p_json); flags(final); };
        channel { flags(final); };
    };

    log {
        filter(f_ids);
        rewrite(r_ids);
        destination(d_elasticsearch);
        flags(final);
    };

    log {
        filter(f_web);
        junction {
            channel { filter { program("^apache-access$"); }; parser(p_apache_access); flags(final); };
            channel { flags(final); };
        };
        rewrite(r_web);
        destination(d_elasticsearch);
        flags(final);
    };

    log {
        rewrite(r_syslog);
        destination(d_elasticsearch);
    };
};
